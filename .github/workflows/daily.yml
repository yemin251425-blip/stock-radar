name: daily-update

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 한국시간 평일 18:00 (UTC 09:00)
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - name: 데이터 수집 + 계산
        run: python scripts/collect.py
      - name: 블로그 글 생성
        run: python scripts/blog.py
      - name: 결과 커밋
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git commit -m "data: $(date -u +'%Y-%m-%d')" || echo "변경 없음"
          git push
      - name: 봇 연결 (웹훅)
        if: ${{ env.TG_TOKEN != '' }}
        run: python scripts/bot_setup.py
      - name: 텔레그램 (소유자) TOP10 + 블로그 글
        if: ${{ env.TG_TOKEN != '' }}
        run: python scripts/notify.py
